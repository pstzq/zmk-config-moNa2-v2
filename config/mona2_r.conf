#Mouse config ---------------------
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
# レイヤー配色 (最上位アクティブ層の色を常時表示。0=消灯 1=赤 2=緑 3=黄 4=青 5=マゼンタ 6=シアン 7=白)
# ベース層(MAC/WIN/O24)は常時点灯を避けるため消灯。BLEの赤は拡散でオレンジに見える
# 注意: .conf は行末コメント非対応(値の一部として解釈されビルドが落ちる)。コメントは行頭に書くこと
# MAC=消灯 / WIN=消灯 / O24=消灯
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=0
# SYM=緑 / NUM=青 / NAV-M=シアン / NAV-W=シアン
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6
# MOUSE(AML)=白 / BLE=赤(オレンジに見える) / PAN=黄
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_9_COLOR=3
# SNAP-M=マゼンタ / SNAP-W=マゼンタ / CURSOR(未使用)=消灯
CONFIG_RGBLED_WIDGET_LAYER_10_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_11_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_12_COLOR=0
# CLICK=白(MOUSE系)
CONFIG_RGBLED_WIDGET_LAYER_13_COLOR=7

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
# 施錠は維持する (BLE層の &studio_unlock で解錠してから接続する運用)
CONFIG_ZMK_STUDIO_LOCKING=y

# zmk-feature-custom-settings (DYA Studio 共通基盤) -------------------
# runtime-combo / runtime-macro / runtime-input-processor が全てこの上に乗る。
# 下の5つのフィーチャーゲートは既定値がバージョンで変わるため明示的に立てる
# (暗黙の既定に頼ると更新時に静かにコンパイルアウトされる)。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUES=y
CONFIG_ZMK_CUSTOM_SETTINGS_ARRAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_KEYSPACE=y
CONFIG_ZMK_CUSTOM_SETTINGS_RPC_CONVERTERS=y
CONFIG_ZMK_CUSTOM_SETTINGS_RECORD=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# zmk-feature-runtime-combo (DYA Studio からコンボを追加・編集・削除) -------------------
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# スロット数。1スロットあたり RAM 約64バイト。0〜7 が .keymap の既定、8〜15 が自由枠
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
# 旧 zmk,combos の既定 (50ms) に合わせる
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50

# zmk-feature-runtime-macro (DYA Studio からマクロを作成・編集・削除) -------------------
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# ランタイムマクロは behavior local ID で束縛を保存するため CRC16 が必要
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# zmk-module-ble-management -------------------
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# zmk-module-battery-history -------------------
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# zmk-module-settings-rpc -------------------
# 注: このモジュールだけサブフラグが _STUDIO_RPC ではなく _STUDIO
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split relay and central stack -------------------
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にすること
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096

# zmk-module-runtime-input-processor -------------------
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# zmk-behavior-runtime-sensor-rotate -------------------
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# zmk-driver-pmw3610-with-custom-studio-rpc -------------------
# トラックボールの CPI / 軸反転などを DYA Studio から確認・変更できるようにする
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# zmk-module-mouse-gesture-rpc -------------------
# DYA Studio からのジェスチャー登録。慣性スクロールの入力プロセッサも同モジュール提供
CONFIG_ZMK_MOUSE_GESTURE_RPC=y

# DYA Studio 診断タブ -------------------
# キースイッチ (42キーなので既定128から縮めて RAM 節約。1ポジション約28バイト)
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# OS ごとのデフォルトレイヤー -------------------
# ベース層は 0=MAC / 1=WIN なので選択範囲を 0..1 にする
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
# 注意: os-detection 自身の CONFIG_ZMK_OS_DETECTION_LAYER_* による自動切替は
# default-layer モジュールと競合するので有効にしないこと

# Studio RPC バッファとスタック -------------------
# 2048 は5層以上でキーマップ読込がフリーズする実績あり。512 で確定
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
# custom RPC を複数積んだことによるスタックオーバーフロー対策
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# settings persistence -------------------
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
