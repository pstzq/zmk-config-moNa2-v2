#Encoder config -------------------
CONFIG_EC11=y
# エンコーダの処理を専用スレッド (優先度は低め) で行う。
# 既定の GLOBAL_THREAD だとシステムワークキュー上で処理され、接点ノイズ (チャタリング) で
# 割り込みが大量に出ると、BLE の送信処理と同じキューを占有して左右通信が止まる。
# さらに分割の送信キューが満杯だと 1 件あたり最大 100ms 待つため、キューごと詰まる。
# 専用スレッドに逃がせば、ノイズが出ても BLE 側の処理が先に回る
CONFIG_EC11_TRIGGER_OWN_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# zmk-module-battery-history -------------------
CONFIG_ZMK_BATTERY_HISTORY=y

# zmk-module-settings-rpc -------------------
CONFIG_ZMK_SETTINGS_RPC=y

# zmk-feature-custom-settings -------------------
# 周辺側は Studio RPC 自体は不要。中継ハンドラをビルドするために relay だけ有効化する
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# 診断 (中央側経由で DYA Studio に返す) -------------------
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_WATCHDOG=y

# Split relay and settings persistence -------------------
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は右手と同じ値にすること (不一致だと中継が壊れる)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

#Bluetooth config -------------------
# 送信出力を既定の 0dBm から +8dBm に上げる (右手と揃える)。電池の持ちは少し短くなる
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 無線イベントの準備が CPU 混雑で遅れたとき、再起動せず 1 回見送って続ける (既定は y = 再起動)
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
# 右手へ送るキー/エンコーダイベントの送信待ち列を 10 件から 32 件に増やす。
# エンコーダを速く回したときに列が埋まって待ちが発生するのを防ぐ (RAM 増加は 1KB 未満)
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=32
